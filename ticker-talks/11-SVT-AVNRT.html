  mcq(s,idx){ return `${kicker({kicker:`MCQ ${s._n} of ${mcqCount}`})}<div class="stem" style="font-size:1.02em">${s.stem}</div>${s.ecg?ecgBlock(s.ecg,s.caption):""}
     ${optsHTML(s,idx)}<div class="btnrow"><button class="btn primary reveal">Reveal answer (R)</button></div>
     <div class="explain"><div class="frag pearl"><b>Answer: ${LET[s.answer]}.</b> ${s.explain||""}${s.ref?`<div class="small muted" style="margin-top:.4em">📚 ${s.ref}</div>`:""}</div></div>`; },
  mcqintro(s){ return `<div class="hero">${kicker({kicker:"Check your understanding"})}<h1>${s.title||"Practice MCQs"}</h1>
     <p class="sub">${s.html||`${mcqCount} single-best-answer questions. Pick an answer on your own first (fingers up for A–E), then reveal.`}</p></div>`; },
  summary(s){ const roles=S.canmeds||[]; return `${kicker({kicker:"Take-home"})}<h2>${s.title||"Take-home points"}</h2>
     <ol>${(s.pearls||[]).map(p=>`<li>${p}</li>`).join("")}</ol>
     <div class="score" id="scorebox"></div>
     ${roles.length?`<div class="card"><h3 style="margin-top:0">CanMEDS lens</h3>${roles.map(r=>`<p><span class="role">${esc(r.role)}:</span> ${r.point}</p>`).join("")}</div>`:""}`; },
  refs(s){ return `${kicker({kicker:"Sources"})}<h2>${s.title||"References"}</h2><ol class="refs">${S.references.map(r=>`<li>${r}</li>`).join("")}</ol>
     ${S.meta.disclaimer?`<div class="disclaimer">${S.meta.disclaimer}</div>`:""}`; },
};
function stepsOf(s){ return (s.steps||[]).length; }
function slideHTML(s, idx, all){
  const fn = R[s.type] || R.teach;
  let html = fn(s, idx);
  const steps = s.steps||[];
  const n = all ? steps.length : (idx===st.i ? st.step : 0);
  html += steps.slice(0,n).map(fragHTML).join("");
  if (!all && n < steps.length && !(s.options && !st.revealed[idx] && s.stepsBeforeReveal!==true)) html += `<div class="hint">▸ ${steps.length-n} more to reveal · press → or Next</div>`;
  html += notesHTML(s);
  return `<section class="slide ${s.type}${(all||st.revealed[idx])?' revealed':''}" data-idx="${idx}">${html}</section>`;
}

/* ---------- render ---------- */
function render(scrollTop){
  const s = slides[st.i];
  $("#stage").innerHTML = slideHTML(s, st.i, false);
  const sec = $("#stage .slide");
  const ch = st.choice[st.i];
  if (ch!=null){ const b=sec.querySelector(`.opt[data-k="${ch}"]`); if(b) b.classList.add("chosen"); }
  sec.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.k)));
  const rv = sec.querySelector(".reveal"); if (rv) rv.addEventListener("click", reveal);
  sec.querySelectorAll(".ecgwrap, .phonowrap").forEach(w=>w.addEventListener("click",()=>zoom(w)));
  const sb = sec.querySelector("#scorebox"); if (sb) sb.innerHTML = scoreText();
  $("#count").textContent = `${st.i+1} / ${slides.length}`;
  $("#progress").style.width = ((st.i+ (stepsOf(s)?st.step/(stepsOf(s)+1):0))/(slides.length-1)*100)+"%";
  $("#prev").disabled = st.i===0 && st.step===0;
  try { history.replaceState(null,"","#s="+(st.i+1)); } catch(e){} // sandboxed previews block this
  if (scrollTop!==false) $("#main").scrollTop = 0; else { const s0=slides[st.i]; const opts=sec.querySelector(".opts"); if (s0.options && st.revealed[st.i] && st.step===0 && opts) { opts.scrollIntoView({behavior:"smooth",block:"start"}); } else { const fr=sec.querySelectorAll(".frag, .explain"); const last=[...fr].filter(x=>x.offsetParent!==null).pop(); if(last) last.scrollIntoView({behavior:"smooth",block:"nearest"}); } }
  save();
}
function scoreText(){
  let right=0, tried=0;
  slides.forEach((s,i)=>{ if(s.type==="mcq" && st.choice[i]!=null){ tried++; if(st.choice[i]===s.answer) right++; }});
  return tried?`<div class="card">Room score on MCQs: <b>${right} / ${mcqCount}</b>${tried<mcqCount?` <span class="muted">(${mcqCount-tried} not answered)</span>`:""}</div>`:"";
}
function choose(k){ if (st.revealed[st.i]) return; const s=slides[st.i]; if(!s.options||k>=s.options.length) return; st.choice[st.i]=k; render(false); }
function reveal(){ const s=slides[st.i]; if(!s.options) return; st.revealed[st.i]=true; render(false); startTimer(); }
function next(){
  startTimer();
  const s=slides[st.i], after = !!s.options && s.stepsBeforeReveal!==true;
  if (st.step < stepsOf(s) && !(after && !st.revealed[st.i])) { st.step++; render(false); return; }
  if (s.options && !st.revealed[st.i]) { reveal(); return; }
  if (st.step < stepsOf(s)) { st.step++; render(false); return; }
  if (st.i < slides.length-1){ st.i++; st.step=0; render(); }
}
function prev(){
  if (st.step>0){ st.step--; render(false); return; }
  if (st.i>0){ st.i--; st.step=stepsOf(slides[st.i]); render(); }
}
function go(i){ st.i=Math.max(0,Math.min(slides.length-1,i)); st.step=0; render(); }
function resetSession(){ st.choice={}; st.revealed={}; st.timer={run:false,t0:0,acc:0}; try{ sessionStorage.removeItem("tt:"+S.meta.id); }catch(e){} tick(); go(0); }
window.addEventListener("hashchange",()=>{ let n=NaN; try{ n=parseInt((location.hash.match(/s=(\d+)/)||[])[1]||"",10); }catch(e){} if(!isNaN(n) && n-1!==st.i && n>=1 && n<=slides.length) go(n-1); });

/* ---------- zoom ---------- */
function zoom(w){ const z=document.createElement("div"); z.className="zoom"; z.innerHTML=w.innerHTML; z.addEventListener("click",()=>z.remove()); document.body.appendChild(z); }

/* ---------- timer ---------- */
const TOTAL = (S.meta.minutes||15)*60;
function elapsed(){ return Math.floor((st.timer.acc + (st.timer.run? (Date.now()-st.timer.t0):0))/1000); }
function startTimer(){ if(!st.timer.run && st.i>=0){ st.timer.run=true; st.timer.t0=Date.now(); } }
function tick(){
  const e=elapsed(), m=String(Math.floor(e/60)).padStart(2,"0"), sec=String(e%60).padStart(2,"0");
  const el=$("#timer"); el.textContent=`⏱ ${m}:${sec} / ${S.meta.minutes||15}:00`;
  el.classList.toggle("over", e>TOTAL); el.classList.toggle("near", e>TOTAL-120 && e<=TOTAL);
}
$("#timer").addEventListener("click",()=>{ if(st.timer.run){ st.timer.acc+=Date.now()-st.timer.t0; st.timer.run=false; } else startTimer(); tick(); });
$("#timer").addEventListener("dblclick",()=>{ st.timer={run:false,t0:0,acc:0}; tick(); save(); });
setInterval(tick, 500); tick();

/* ---------- theme, notes, fullscreen, print ---------- */
function setTheme(t){ document.documentElement.setAttribute("data-theme",t); try{localStorage.setItem("tt:theme",t);}catch(e){} }
let theme; try{ theme=localStorage.getItem("tt:theme"); }catch(e){}
let darkPref=false; try{ darkPref=matchMedia("(prefers-color-scheme: dark)").matches; }catch(e){}
setTheme(theme || (darkPref?"dark":"light"));
$("#themeBtn").addEventListener("click",()=>setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"));
$("#notesBtn").addEventListener("click",()=>document.body.classList.toggle("show-notes"));
if (!document.fullscreenEnabled) $("#fsBtn").style.display="none"; // e.g. app previews and iframes
$("#fsBtn").addEventListener("click",()=>{ try { const r = document.fullscreenElement ? document.exitFullscreen() : (document.documentElement.requestFullscreen && document.documentElement.requestFullscreen()); if (r && r.catch) r.catch(()=>{}); } catch(e){} });
let scale=1; const setScale=v=>{scale=Math.max(.7,Math.min(1.6,v));document.documentElement.style.setProperty("--scale",scale);};
function buildPrint(){ $("#printall").innerHTML = slides.map((s,i)=>slideHTML(s,i,true)).join(""); $("#printall").querySelectorAll("details").forEach(d=>d.open=true); }
window.addEventListener("beforeprint", buildPrint);
$("#prev").addEventListener("click",prev); $("#next").addEventListener("click",next);

document.addEventListener("keydown",e=>{
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  const z=document.querySelector(".zoom"); if(z && (e.key==="Escape"||e.key===" ")){ z.remove(); e.preventDefault(); return; }
  const k=e.key;
  if (k==="ArrowRight"||k===" "||k==="PageDown"||k==="Enter"){ e.preventDefault(); next(); }
  else if (k==="ArrowLeft"||k==="PageUp"||k==="Backspace"){ e.preventDefault(); prev(); }
  else if (k==="Home") go(0); else if (k==="End") go(slides.length-1);
  else if (k==="0") resetSession();
  else if (/^[a-hA-H]$/.test(k) && slides[st.i].options && LET.indexOf(k.toUpperCase())<slides[st.i].options.length){ choose(LET.indexOf(k.toUpperCase())); }
  else if (/^[1-8]$/.test(k) && slides[st.i].options){ choose(+k-1); }
  else if (k==="r"||k==="R") reveal();
  else if (k==="n"||k==="N") document.body.classList.toggle("show-notes");
  else if (k==="t"||k==="T") $("#themeBtn").click();
  else if (k==="f"||k==="F") $("#fsBtn").click();
  else if (k==="+"||k==="=") setScale(scale+.1); else if (k==="-"||k==="_") setScale(scale-.1);
  else if (k==="p"||k==="P"){ buildPrint(); try { window.print(); } catch(e){} }
});
let tx=null, ty=null;
document.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5 && !document.querySelector(".zoom")){ dx<0?next():prev(); } tx=null; });
render();
})();
</script>
</body>
</html>
