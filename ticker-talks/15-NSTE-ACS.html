<style>
:root{
  --bg:#f7f6f2; --surface:#ffffff; --surface2:#efeee8; --ink:#1b1d22; --muted:#5b606b;

  --ok:#1f7a4d; --ok-soft:#dcf1e5; --bad:#a8322a; --bad-soft:#f8e1de; --warn:#8a5a00; --warn-soft:#fbefd4;
  --info:#24527a; --info-soft:#e0ebf5;
  --ecg-bg:#fff7f7; --ecg-minor:#f3c9cc; --ecg-major:#e38f96; --ecg-trace:#111;
  --scale:1;
}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1b1e23; --surface2:#23272e; --ink:#eef0f3; --muted:#a3a9b4;
  --line:#343a43; --accent:#ff5d68; --accent-ink:#1a0a0c; --accent-soft:#3a1c20;
  --ok:#5fd39a; --ok-soft:#163327; --bad:#ff8a7f; --bad-soft:#3a1d1a; --warn:#f3c061; --warn-soft:#382b10;
  --info:#8cc2f0; --info-soft:#17283a;
  --ecg-bg:#14171b; --ecg-minor:#2b2226; --ecg-major:#5a3238; --ecg-trace:#9ff5c4;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:calc(clamp(16px,0.9vw + 9px,24px) * var(--scale));line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
/* top bar */
.bar{position:fixed;inset:0 0 auto 0;height:3.0em;display:flex;align-items:center;gap:.6em;padding:0 1em;
  background:var(--surface);border-bottom:1px solid var(--line);z-index:5;font-size:.62em}
.brand{font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand b{color:var(--accent)}
.bar .title{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:.25em .8em;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.timer.over{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.timer.near{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.progress{position:fixed;top:3.0em;left:0;height:4px;background:var(--accent);transition:width .25s;z-index:6;font-size:.62em}
/* stage */
main{position:absolute;inset:0;padding:calc(3.0em*.62 + 18px) 0 calc(3.2em*.62 + 16px);overflow-y:auto}
.slide{max-width:1180px;margin:0 auto;padding:0 16px 1em;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kicker{display:inline-flex;gap:.5em;align-items:center;font-size:.7em;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:.4em 0 .2em}
.kicker .clock{font-variant-numeric:tabular-nums;background:var(--accent);color:var(--accent-ink);padding:.05em .55em;border-radius:6px;letter-spacing:.02em}
h1{font-size:2.1em;line-height:1.1;margin:.2em 0 .3em;letter-spacing:-.01em}
h2{font-size:1.45em;line-height:1.15;margin:.15em 0 .5em;letter-spacing:-.005em}
h3{font-size:1.05em;margin:.8em 0 .3em}
p{margin:.4em 0}
ul,ol{margin:.3em 0 .5em;padding-left:1.3em}
li{margin:.18em 0}
.muted{color:var(--muted)}
.small{font-size:.8em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.8em 1em;margin:.6em 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.vitals{display:flex;flex-wrap:wrap;gap:.5em;margin:.5em 0}
.vital{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.3em .7em;min-width:6.2em}
.vital .k{font-size:.62em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.vital .v{font-size:1.15em;font-weight:700;font-variant-numeric:tabular-nums}
.vital.flag{border-color:var(--bad);background:var(--bad-soft)}
.vital.flag .v{color:var(--bad)}
.frag{margin:.5em 0;padding:.55em .9em;border-left:4px solid var(--accent);background:var(--surface);border-radius:0 10px 10px 0;animation:fade .25s ease}
.frag,.explain{scroll-margin-bottom:28px}
.frag.pearl{border-left-color:var(--info);background:var(--info-soft)}
.frag.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.ask{font-size:1.1em;font-weight:650;margin:.6em 0;padding:.6em .9em;border:2px dashed var(--accent);border-radius:12px;background:var(--accent-soft)}
.ask::before{content:"🗣 Ask the room: ";color:var(--accent)}
.hint{font-size:.7em;color:var(--muted);margin-top:.8em}
/* options */
.opts{display:grid;gap:.5em;margin:.7em 0}
.opt{display:flex;gap:.7em;align-items:flex-start;text-align:left;width:100%;padding:.6em .8em;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt .L{flex:0 0 auto;width:1.8em;height:1.8em;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--surface2);border:1px solid var(--line)}
.opt .body{flex:1}
.opt .fb{display:none;font-size:.85em;margin-top:.35em}
.opt.chosen{border-color:var(--info);box-shadow:0 0 0 3px var(--info-soft)}
.opt.chosen .L{background:var(--info);color:var(--surface);border-color:var(--info)}
.revealed .opt{cursor:default}
.revealed .opt .fb{display:block}
.revealed .opt.right{border-color:var(--ok);background:var(--ok-soft)}
.revealed .opt.right .L{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.revealed .opt.wrong{opacity:.8}
.revealed .opt.wrong.chosen{border-color:var(--bad);background:var(--bad-soft);opacity:1}
.revealed .opt.wrong.chosen .L{background:var(--bad);border-color:var(--bad)}
.tag{display:inline-block;font-size:.7em;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:.05em .5em;border-radius:6px;margin-right:.4em}
.tag.ok{background:var(--ok);color:var(--surface)}
.tag.no{background:var(--bad);color:var(--surface)}
.explain{display:none}
.revealed .explain{display:block;animation:fade .25s ease}
.btnrow{display:flex;gap:.5em;flex-wrap:wrap;margin:.6em 0}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:.45em 1em;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.revealed .btn.reveal{display:none}
/* title slide */
.hero{min-height:58vh;display:flex;flex-direction:column;justify-content:center}
.hero .series{font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-size:.8em}
.hero .sub{font-size:1.15em;color:var(--muted);max-width:44em}
.meta{display:flex;flex-wrap:wrap;gap:.5em;margin-top:1em;font-size:.75em}
.meta span{border:1px solid var(--line);border-radius:999px;padding:.2em .8em;background:var(--surface)}
.pulse{display:block;width:min(520px,90%);height:60px;margin:.4em 0 .6em}
.pulse path{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
/* mapping */
.epa{display:flex;gap:.6em;align-items:baseline;margin:.35em 0}
.epa code{flex:0 0 auto;font:700 .72em ui-monospace,Menlo,Consolas,monospace;background:var(--info-soft);color:var(--info);padding:.15em .5em;border-radius:6px}
.role{font-weight:700;color:var(--info)}
/* ECG */
.ecg{width:100%;max-height:56vh;border:1px solid var(--line);border-radius:10px;background:var(--ecg-bg);cursor:zoom-in;display:block}
.ecg .minor{stroke:var(--ecg-minor);stroke-width:.5}
.ecg .major{stroke:var(--ecg-major);stroke-width:1}
.ecg .trace{fill:none;stroke:var(--ecg-trace);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ecg text{fill:var(--ecg-trace);font:700 15px system-ui,sans-serif}
.ecg .hl{fill:var(--accent);opacity:.12}
.phono{width:100%;display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;cursor:zoom-in;max-height:40vh}
.phono .base{stroke:var(--line);stroke-width:1.5}
.phono .snd{stroke:var(--ink);stroke-width:2.2}
.phono .mur{stroke:var(--accent);stroke-width:1.6;opacity:.85}
.phono .brk{fill:none;stroke:var(--muted);stroke-width:1.5}
.phono text{fill:var(--muted);font:600 15px system-ui,sans-serif;text-anchor:middle}
.phono .sl{fill:var(--ink);font-weight:800}
.phono .ml{fill:var(--accent);font-weight:700}
.zoom .phono{background:var(--surface)}
details.objs summary{cursor:pointer;font-weight:700;list-style:none;display:flex;align-items:center;gap:.5em}
details.objs summary::-webkit-details-marker{display:none}
details.objs summary::before{content:"▸";color:var(--accent);transition:transform .15s}
details.objs[open] summary::before{transform:rotate(90deg)}
details.objs[open] summary{margin-bottom:.4em}
.ecgcap{font-size:.72em;color:var(--muted);margin:.25em 0 .4em}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-out}
.zoom svg{width:100%;max-height:100%;cursor:zoom-out}
@media (max-width:760px){.zoom{overflow:auto;justify-content:flex-start}.zoom svg{width:auto;height:auto;min-width:980px;max-height:none}}
/* notes + nav */
.notes{display:none;margin:1em 0;padding:.7em 1em;border-radius:12px;background:var(--warn-soft);border:1px solid var(--warn);font-size:.8em}
.notes::before{content:"Presenter notes";display:block;font-weight:800;text-transform:uppercase;font-size:.75em;letter-spacing:.08em;color:var(--warn);margin-bottom:.2em}
body.show-notes .notes{display:block}
.nav{position:fixed;inset:auto 0 0 0;height:3.2em;display:flex;align-items:center;justify-content:space-between;gap:.5em;padding:0 1em;
  background:var(--surface);border-top:1px solid var(--line);z-index:5;font-size:.62em}
.nav .count{color:var(--muted);font-variant-numeric:tabular-nums}
.nav .btn{padding:.5em 1.3em}
.score{font-weight:700}
table.t{border-collapse:collapse;width:100%;font-size:.85em;margin:.4em 0}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:.35em .5em;text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:700;font-size:.85em;text-transform:uppercase;letter-spacing:.04em}
.refs li{font-size:.72em;margin:.35em 0}
.disclaimer{font-size:.68em;color:var(--muted);border-top:1px solid var(--line);margin-top:1em;padding-top:.5em}
#printall{display:none}
@media (max-width:500px){.vital .k,.tag{font-size:11px}}
@media print{
  .bar,.progress,.nav,#stage,.zoom{display:none!important}
  #printall{display:block}
  main{position:static;padding:0;overflow:visible}
  body{font-size:11pt;background:#fff;color:#000}
  .slide{page-break-inside:avoid;break-inside:avoid;border-bottom:1px solid #ccc;padding:10pt 0;animation:none;max-width:none}
  .frag,.explain,.slide,.pulse path{animation:none!important;opacity:1!important}
  .notes{display:block}
  .opt .fb,.explain{display:block}
  .hero{min-height:0}
  .ecg{cursor:default}
}
</style>

    <div class="series">${esc(m.series||"Ticker Talks")}${m.number?` · Session ${esc(m.number)}`:""}</div>
    <svg class="pulse" viewBox="0 0 520 60" aria-hidden="true"><path d="M0 40 H150 l10 -6 l10 6 H200 l8 6 l12 -44 l12 52 l8 -14 H300 q20 -18 40 0 H520"/></svg>
    <h1>${m.title}</h1><div class="sub">${m.subtitle||""}</div>
    <div class="meta">${m.duration?`<span>⏱ ${esc(m.duration)}</span>`:""}${m.audience?`<span>👥 ${esc(m.audience)}</span>`:""}${m.setting?`<span>📍 ${esc(m.setting)}</span>`:""}${m.updated?`<span>Updated ${esc(m.updated)}</span>`:""}</div>
    ${s.html||""}</div>`; },
  objectives(s){ return `${kicker({kicker:"Before we start"})}<h2>${s.title||"By the end of this talk you can…"}</h2>
    <ol>${S.objectives.map(o=>`<li>${o}</li>`).join("")}</ol>
    <details class="card objs"><summary>${S.mappingTitle||"Internal medicine training objectives this case covers"} <span class="muted small">(${(S.mapping||S.epas||[]).length})</span></summary>${(S.mapping||S.epas||[]).map(e=>`<div class="epa"><code>${esc(e.code)}</code><span>${e.title}${e.how?` <span class="muted small">· ${e.how}</span>`:""}</span></div>`).join("")}</details>`; },
  case(s){ return `${kicker(s)}<h2>${s.title||""}</h2>${s.html||""}${vitalsHTML(s.vitals)}${s.ecg?ecgBlock(s.ecg,s.caption):""}${s.phono?phonoBlock(s.phono,s.phonoCaption):""}${s.ask?`<div class="ask">${s.ask}</div>`:""}`; },
  teach(s){ return `${kicker(Object.assign({kicker:"Teaching point"},s))}<h2>${s.title||""}</h2>${s.html||""}${s.ecg?ecgBlock(s.ecg,s.caption):""}${s.phono?phonoBlock(s.phono,s.phonoCaption):""}`; },
  decision(s,idx){ return `${kicker(Object.assign({kicker:"Decision point"},s))}<h2>${s.title||""}</h2>${s.html||""}${s.ecg?ecgBlock(s.ecg,s.caption):""}${s.phono?phonoBlock(s.phono,s.phonoCaption):""}${s.prompt?`<div class="ask">${s.prompt}</div>`:""}
     ${optsHTML(s,idx)}<div class="btnrow"><button class="btn primary reveal">Reveal answer (R)</button></div>
     <div class="explain">${s.explain?`<div class="frag pearl">${s.explain}</div>`:""}</div>`; },
  mcq(s,idx){ return `${kicker({kicker:`MCQ ${s._n} of ${mcqCount}`})}<div class="stem" style="font-size:1.02em">${s.stem}</div>${s.ecg?ecgBlock(s.ecg,s.caption):""}
     ${optsHTML(s,idx)}<div class="btnrow"><button class="btn primary reveal">Reveal answer (R)</button></div>
     <div class="explain"><div class="frag pearl"><b>Answer: ${LET[s.answer]}.</b> ${s.explain||""}${s.ref?`<div class="small muted" style="margin-top:.4em">📚 ${s.ref}</div>`:""}</div></div>`; },
  mcqintro(s){ return `<div class="hero">${kicker({kicker:"Check your understanding"})}<h1>${s.title||"Practice MCQs"}</h1>
     <p class="sub">${s.html||`${mcqCount} single-best-answer questions. Pick an answer on your own first (fingers up for A–E), then reveal.`}</p></div>`; },
  summary(s){ const roles=S.canmeds||[]; return `${kicker({kicker:"Take-home"})}<h2>${s.title||"Take-home points"}</h2>
     <ol>${(s.pearls||[]).map(p=>`<li>${p}</li>`).join("")}</ol>
     <div class="score" id="scorebox"></div>
     ${roles.length?`<div class="card"><h3 style="margin-top:0">CanMEDS lens</h3>${roles.map(r=>`<p><span class="role">${esc(r.role)}:</span> ${r.point}</p>`).join("")}</div>`:""}`; },
  refs(s){ return `${kicker({kicker:"Sources"})}<h2>${s.title||"References"}</h2><ol class="refs">${S.references.map(r=>`<li>${r}</li>`).join("")}</ol>
     ${S.meta.disclaimer?`<div class="disclaimer">${S.meta.disclaimer}</div>`:""}`; },
};
function stepsOf(s){ return (s.steps||[]).length; }
function slideHTML(s, idx, all){
  const fn = R[s.type] || R.teach;
  let html = fn(s, idx);
  const steps = s.steps||[];
  const n = all ? steps.length : (idx===st.i ? st.step : 0);
  html += steps.slice(0,n).map(fragHTML).join("");
  if (!all && n < steps.length && !(s.options && !st.revealed[idx] && s.stepsBeforeReveal!==true)) html += `<div class="hint">▸ ${steps.length-n} more to reveal · press → or Next</div>`;
  html += notesHTML(s);
  return `<section class="slide ${s.type}${(all||st.revealed[idx])?' revealed':''}" data-idx="${idx}">${html}</section>`;
}

/* ---------- render ---------- */
function render(scrollTop){
  const s = slides[st.i];
  $("#stage").innerHTML = slideHTML(s, st.i, false);
  const sec = $("#stage .slide");
  const ch = st.choice[st.i];
  if (ch!=null){ const b=sec.querySelector(`.opt[data-k="${ch}"]`); if(b) b.classList.add("chosen"); }
  sec.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>choose(+b.dataset.k)));
  const rv = sec.querySelector(".reveal"); if (rv) rv.addEventListener("click", reveal);
  sec.querySelectorAll(".ecgwrap, .phonowrap").forEach(w=>w.addEventListener("click",()=>zoom(w)));
  const sb = sec.querySelector("#scorebox"); if (sb) sb.innerHTML = scoreText();
  $("#count").textContent = `${st.i+1} / ${slides.length}`;
  $("#progress").style.width = ((st.i+ (stepsOf(s)?st.step/(stepsOf(s)+1):0))/(slides.length-1)*100)+"%";
  $("#prev").disabled = st.i===0 && st.step===0;
  try { history.replaceState(null,"","#s="+(st.i+1)); } catch(e){} // sandboxed previews block this
  if (scrollTop!==false) $("#main").scrollTop = 0; else { const s0=slides[st.i]; const opts=sec.querySelector(".opts"); if (s0.options && st.revealed[st.i] && st.step===0 && opts) { opts.scrollIntoView({behavior:"smooth",block:"start"}); } else { const fr=sec.querySelectorAll(".frag, .explain"); const last=[...fr].filter(x=>x.offsetParent!==null).pop(); if(last) last.scrollIntoView({behavior:"smooth",block:"nearest"}); } }
  save();
}
function scoreText(){
  let right=0, tried=0;
  slides.forEach((s,i)=>{ if(s.type==="mcq" && st.choice[i]!=null){ tried++; if(st.choice[i]===s.answer) right++; }});
  return tried?`<div class="card">Room score on MCQs: <b>${right} / ${mcqCount}</b>${tried<mcqCount?` <span class="muted">(${mcqCount-tried} not answered)</span>`:""}</div>`:"";
}
function choose(k){ if (st.revealed[st.i]) return; const s=slides[st.i]; if(!s.options||k>=s.options.length) return; st.choice[st.i]=k; render(false); }
function reveal(){ const s=slides[st.i]; if(!s.options) return; st.revealed[st.i]=true; render(false); startTimer(); }
function next(){
  startTimer();
  const s=slides[st.i], after = !!s.options && s.stepsBeforeReveal!==true;
  if (st.step < stepsOf(s) && !(after && !st.revealed[st.i])) { st.step++; render(false); return; }
  if (s.options && !st.revealed[st.i]) { reveal(); return; }
  if (st.step < stepsOf(s)) { st.step++; render(false); return; }
  if (st.i < slides.length-1){ st.i++; st.step=0; render(); }
}
function prev(){
  if (st.step>0){ st.step--; render(false); return; }
  if (st.i>0){ st.i--; st.step=stepsOf(slides[st.i]); render(); }
}
function go(i){ st.i=Math.max(0,Math.min(slides.length-1,i)); st.step=0; render(); }
function resetSession(){ st.choice={}; st.revealed={}; st.timer={run:false,t0:0,acc:0}; try{ sessionStorage.removeItem("tt:"+S.meta.id); }catch(e){} tick(); go(0); }
window.addEventListener("hashchange",()=>{ let n=NaN; try{ n=parseInt((location.hash.match(/s=(\d+)/)||[])[1]||"",10); }catch(e){} if(!isNaN(n) && n-1!==st.i && n>=1 && n<=slides.length) go(n-1); });

/* ---------- zoom ---------- */
function zoom(w){ const z=document.createElement("div"); z.className="zoom"; z.innerHTML=w.innerHTML; z.addEventListener("click",()=>z.remove()); document.body.appendChild(z); }

/* ---------- timer ---------- */
const TOTAL = (S.meta.minutes||15)*60;
function elapsed(){ return Math.floor((st.timer.acc + (st.timer.run? (Date.now()-st.timer.t0):0))/1000); }
function startTimer(){ if(!st.timer.run && st.i>=0){ st.timer.run=true; st.timer.t0=Date.now(); } }
function tick(){
  const e=elapsed(), m=String(Math.floor(e/60)).padStart(2,"0"), sec=String(e%60).padStart(2,"0");
  const el=$("#timer"); el.textContent=`⏱ ${m}:${sec} / ${S.meta.minutes||15}:00`;
  el.classList.toggle("over", e>TOTAL); el.classList.toggle("near", e>TOTAL-120 && e<=TOTAL);
}
$("#timer").addEventListener("click",()=>{ if(st.timer.run){ st.timer.acc+=Date.now()-st.timer.t0; st.timer.run=false; } else startTimer(); tick(); });
$("#timer").addEventListener("dblclick",()=>{ st.timer={run:false,t0:0,acc:0}; tick(); save(); });
setInterval(tick, 500); tick();

/* ---------- theme, notes, fullscreen, print ---------- */
function setTheme(t){ document.documentElement.setAttribute("data-theme",t); try{localStorage.setItem("tt:theme",t);}catch(e){} }
let theme; try{ theme=localStorage.getItem("tt:theme"); }catch(e){}
let darkPref=false; try{ darkPref=matchMedia("(prefers-color-scheme: dark)").matches; }catch(e){}
setTheme(theme || (darkPref?"dark":"light"));
$("#themeBtn").addEventListener("click",()=>setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"));
$("#notesBtn").addEventListener("click",()=>document.body.classList.toggle("show-notes"));
if (!document.fullscreenEnabled) $("#fsBtn").style.display="none"; // e.g. app previews and iframes
$("#fsBtn").addEventListener("click",()=>{ try { const r = document.fullscreenElement ? document.exitFullscreen() : (document.documentElement.requestFullscreen && document.documentElement.requestFullscreen()); if (r && r.catch) r.catch(()=>{}); } catch(e){} });
let scale=1; const setScale=v=>{scale=Math.max(.7,Math.min(1.6,v));document.documentElement.style.setProperty("--scale",scale);};
function buildPrint(){ $("#printall").innerHTML = slides.map((s,i)=>slideHTML(s,i,true)).join(""); $("#printall").querySelectorAll("details").forEach(d=>d.open=true); }
window.addEventListener("beforeprint", buildPrint);
$("#prev").addEventListener("click",prev); $("#next").addEventListener("click",next);

document.addEventListener("keydown",e=>{
  if (e.metaKey||e.ctrlKey||e.altKey) return;
  const z=document.querySelector(".zoom"); if(z && (e.key==="Escape"||e.key===" ")){ z.remove(); e.preventDefault(); return; }
  const k=e.key;
  if (k==="ArrowRight"||k===" "||k==="PageDown"||k==="Enter"){ e.preventDefault(); next(); }
  else if (k==="ArrowLeft"||k==="PageUp"||k==="Backspace"){ e.preventDefault(); prev(); }
  else if (k==="Home") go(0); else if (k==="End") go(slides.length-1);
  else if (k==="0") resetSession();
  else if (/^[a-hA-H]$/.test(k) && slides[st.i].options && LET.indexOf(k.toUpperCase())<slides[st.i].options.length){ choose(LET.indexOf(k.toUpperCase())); }
  else if (/^[1-8]$/.test(k) && slides[st.i].options){ choose(+k-1); }
  else if (k==="r"||k==="R") reveal();
  else if (k==="n"||k==="N") document.body.classList.toggle("show-notes");
  else if (k==="t"||k==="T") $("#themeBtn").click();
  else if (k==="f"||k==="F") $("#fsBtn").click();
  else if (k==="+"||k==="=") setScale(scale+.1); else if (k==="-"||k==="_") setScale(scale-.1);
  else if (k==="p"||k==="P"){ buildPrint(); try { window.print(); } catch(e){} }
});
let tx=null, ty=null;
document.addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5 && !document.querySelector(".zoom")){ dx<0?next():prev(); } tx=null; });
render();
})();
</script>
<script src="../ctl-notice.js" defer></script>
</body>
</html>
